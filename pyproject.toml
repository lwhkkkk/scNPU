[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singlecell-npu"
version = "0.1.0"
description = "Bounded-memory single-cell preprocessing for Ascend, with explicit CPU cooperation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2", "anndata>=0.10", "scanpy>=1.11,<1.12", "h5py>=3.10", "threadpoolctl>=3", "matplotlib>=3.8"]

[project.scripts]
singlecell-npu = "singlecell_npu.streaming:main"

[tool.setuptools.packages.find]
include = ["singlecell_npu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["npu: requires Ascend hardware and torch_npu", "tilelang: requires the tested TileLang Ascend environment"]
